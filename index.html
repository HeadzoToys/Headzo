<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Explicit https to avoid file:// weirdness -->
  <link href="https://cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">

  <style>
    :root {
      --brand-red:#BC1225;
      --brand-red-dark:#8D0D1B;
      --focus-ring:#1a1a1a;
      --field-border:#c9c9c9;
      --text:#111;
    }

    html, body { min-height: 100%; }
    body{
      font-family: Arial, sans-serif;
      background:#fff;
      color:var(--text);
      margin:0;
      padding:30px 20px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      text-align:center;
    }
    main{ width:100%; }

    img.logo{
      max-width:300px; width:100%; height:auto;
      margin:0 auto 15px; display:block;
    }
    p.intro{
      font-size:1.2em; max-width:600px;
      margin:0 auto 25px; color:#555;
    }

    /* ===============================
       CTA buttons
       =============================== */
    a.cta{
      display:block;
      width:220px;
      margin:8px auto;
      padding:12px 0;
      font-size:1.05em;
      color:#fff;
      background:var(--brand-red);
      border:1px solid transparent;
      border-radius:8px;
      text-decoration:none !important;
      -webkit-text-decoration:none !important;
      outline:none;
      box-shadow:none;
      background-clip:padding-box;
      transition: background-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    html body a.cta:hover,
    html body a.cta:focus,
    html body a.cta:active{
      text-decoration:none !important;
      -webkit-text-decoration:none !important;
      border-bottom:none !important;
      background:var(--brand-red-dark);
    }
    a.cta:focus-visible{
      outline:3px solid var(--focus-ring);
      outline-offset:2px;
    }
    a.cta::before,
    a.cta::after { content:none !important; }

    /* ===============================
       Mailchimp area
       =============================== */
    #mc_embed_shell{ margin:25px auto 0; text-align:center; }
    #mc_embed_signup{
      background:#fff;
      font:14px Helvetica,Arial,sans-serif;
      width:100%; max-width:600px; margin:0 auto;
      text-align:center;
    }
    #mc_embed_signup h2{
      font-size:.95rem; line-height:1.4;
      margin:0 0 10px; color:#444; font-weight:500;
    }

    /* Grid row: label | input | button */
    #mc_embed_signup .mc-field-group{
      display:grid;
      grid-template-columns: max-content 250px max-content;
      grid-auto-rows: 40px;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-top:6px;
    }

    #mc_embed_signup .mc-field-group label{
      font-weight:500; color:#666; font-size:.9rem;
      margin:0; text-align:right; min-width:110px;
      line-height:40px;
    }

    /* Normalize metrics */
    #mc_embed_signup .mc-field-group input[type="email"],
    #mc_embed_signup .mc-field-group .button{
      box-sizing:border-box !important;
      height:100% !important;
      border-radius:8px !important;
      font-size:15px;
    }

    /* Email field */
    #mc_embed_signup .mc-field-group input[type="email"]{
      width:250px; max-width:100%;
      padding:0 10px;
      border:1px solid var(--field-border);
      color:var(--text);
      outline:none;
      line-height: normal;
      background:#fff;
    }
    #mc_embed_signup .mc-field-group input[type="email"]::placeholder{ color:#888; }
    #mc_embed_signup .mc-field-group input[type="email"]:focus-visible{
      outline:3px solid var(--focus-ring);
      outline-offset:2px;
    }

    /* Submit button */
    #mc_embed_signup .mc-field-group .button{
      all: unset;
      display:inline-flex !important;
      align-items:center; justify-content:center;
      height:100% !important;
      padding:0 20px !important;
      border:1px solid transparent !important; /* looks borderless */
      border-radius:8px !important;
      background:var(--brand-red) !important;
      color:#fff !important;
      font-size:15px;
      font-weight:700;
      text-decoration:none !important;
      box-shadow:none !important;
      outline:none !important;
      background-clip:padding-box;
      -webkit-appearance:none; appearance:none;
      cursor:pointer;
      line-height:normal;
    }
    #mc_embed_signup .mc-field-group .button:hover{
      background:var(--brand-red-dark) !important;
      border-color:transparent !important;
    }
    #mc_embed_signup .mc-field-group .button:focus-visible{
      outline:none !important;
      box-shadow:0 0 0 3px var(--focus-ring) !important;
    }

    /* ===== Mobile: stack and make input+button same width ===== */
    @media (max-width:520px){
      #mc_embed_signup .mc-field-group{
        grid-template-columns:1fr;
        gap:8px;
      }
      #mc_embed_signup .mc-field-group label{
        text-align:center; min-width:0;
        line-height:1.2; /* tighter label on mobile */
      }
      #mc_embed_signup .mc-field-group input[type="email"],
      #mc_embed_signup .mc-field-group .button{
        width:100% !important;
        max-width:100% !important;
        justify-content:center;   /* centers button text */
      }
    }

    footer{ font-size:.85em; color:#888; margin-top:25px; padding:15px 0 8px; }
  </style>
</head>
<body>
  <main>
    <img src="headzo toys banner.png" alt="Headzo Toys Logo" class="logo" />
    <p class="intro">
      Specializing in unique 3D-printed creations along with heads and accessories for your action figures and Mego customs
    </p>

    <!-- CTAs -->
    <a href="https://www.ebay.com/usr/headzotoys" class="cta" target="_blank" rel="noopener noreferrer">eBay</a>
    <a href="https://headzotoyshop.etsy.com/" class="cta" target="_blank" rel="noopener noreferrer">Etsy</a>
    <a href="https://www.instagram.com/headzotoys" class="cta" target="_blank" rel="noopener noreferrer">Instagram</a>

    <!-- Mailchimp Signup -->
    <div id="mc_embed_shell">
      <div id="mc_embed_signup">
        <form action="https://headzotoys.us18.list-manage.com/subscribe/post?u=f03377bc30ec66aa74e149ffc&amp;id=76b776feed&amp;f_id=00a3b8e6f0"
              method="post" target="_blank" novalidate>
          <div id="mc_embed_signup_scroll">
            <h2>Sign up to receive discounts, occasional updates on new releases and alerts about small run and one-of-a-kind items</h2>

            <div class="mc-field-group">
              <label for="mce-EMAIL">Email address</label>
              <input type="email" name="EMAIL" id="mce-EMAIL" required aria-label="Email address">
              <input type="submit" name="subscribe" class="button" value="Subscribe" aria-label="Subscribe to mailing list">
            </div>

            <!-- Honeypot -->
            <div style="position:absolute; left:-5000px;" aria-hidden="true">
              <input type="text" name="b_f03377bc30ec66aa74e149ffc_76b776feed" tabindex="-1" value="">
            </div>
          </div>
        </form>
      </div>
    </div>
    <!-- /Mailchimp Signup -->
  </main>

  <footer>
    &copy; <span id="year"></span> Headzo Toys
  </footer>

  <script src="https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
  <script>
    (function(){
      var yearSpan=document.getElementById("year");
      if(yearSpan) yearSpan.textContent=new Date().getFullYear();
    })();
  </script>
  <noscript><div style="padding:8px; color:#111;">JavaScript is disabled. The page still works, but the signup validation script won’t load.</div></noscript>
</body>
</html>
