      max-width: 600px;
      margin: 0 auto 25px auto;
      color: #555;
    }

       =============================== */

      font-size: 1.05em;
      transition: background-color 0.3s ease;
      border: none;
      outline: none;
      box-shadow: none;
      background-clip: padding-box;
